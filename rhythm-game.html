<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON PULSE — Web Audio Rhythm Game</title>
<style>
  :root{
    --bg:#080b16;
    --bg2:#0d1226;
    --panel:#121a30;
    --panel-border:#26315a;
    --pink:#ff4fd1;
    --gold:#ffd447;
    --cyan:#3be8ff;
    --green:#49ff9e;
    --silver:#e7ecf5;
    --text:#e9edf7;
    --muted:#8a93b3;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(circle at 20% 0%, #16204a 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #2a1240 0%, transparent 40%),
      linear-gradient(180deg, var(--bg2), var(--bg) 60%);
    color:var(--text);
    font-family:'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    position:relative;
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
  }
  .hidden{display:none !important;}

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;
    background:rgba(6,9,20,0.72);
    backdrop-filter:blur(6px);
    z-index:50;
    text-align:center;
    padding:24px;
  }
  .title{
    font-size:clamp(2rem, 6vw, 3.2rem);
    font-weight:800;
    letter-spacing:0.12em;
    margin:0;
    background:linear-gradient(90deg, var(--cyan), var(--pink) 60%, var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(59,232,255,0.25);
  }
  .subtitle{
    color:var(--muted);
    max-width:520px;
    line-height:1.6;
    font-size:0.95rem;
    margin:0;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:16px;
    padding:22px 28px;
    display:flex;flex-direction:column;gap:16px;
    box-shadow:0 12px 40px rgba(0,0,0,0.4);
    min-width:300px;
  }
  .field-row{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    font-size:0.9rem;color:var(--muted);
  }
  .field-row select, .field-row button.toggle{
    background:#0e1730;
    color:var(--text);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 12px;
    font-size:0.9rem;
    cursor:pointer;
  }
  .field-row select:focus, .field-row button.toggle:focus{outline:2px solid var(--cyan);}
  button.toggle.off{color:var(--muted);border-color:#3a3f55;}
  .big-btn{
    margin-top:6px;
    padding:14px 46px;
    font-size:1.2rem;
    font-weight:800;
    letter-spacing:0.15em;
    color:#08101f;
    background:linear-gradient(90deg, var(--cyan), var(--green));
    border:none;border-radius:12px;
    cursor:pointer;
    box-shadow:0 0 30px rgba(59,232,255,0.35);
    transition:transform 0.12s ease;
  }
  .big-btn:hover{transform:translateY(-2px);}
  .big-btn:active{transform:translateY(0);}

  #countdownOverlay{background:rgba(6,9,20,0.55);}
  #countdownNum{
    font-size:8rem;
    font-weight:900;
    color:var(--gold);
    text-shadow:0 0 60px rgba(255,212,71,0.6);
    animation:pop-in 0.35s ease;
  }
  @keyframes pop-in{
    0%{transform:scale(0.4);opacity:0;}
    60%{transform:scale(1.15);opacity:1;}
    100%{transform:scale(1);opacity:1;}
  }

  /* ---------- Game screen ---------- */
  #gameScreen{
    position:relative;
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:18px 12px 28px;
  }
  #hud{
    width:100%;max-width:620px;
    display:flex;justify-content:space-between;
    padding:6px 10px;
    font-size:0.95rem;
    letter-spacing:0.05em;
  }
  #hud .stat{display:flex;flex-direction:column;align-items:center;min-width:90px;}
  #hud .stat .label{color:var(--muted);font-size:0.65rem;letter-spacing:0.15em;}
  #hud .stat .val{font-size:1.3rem;font-weight:800;color:var(--text);}
  #hud .stat.score .val{color:var(--gold);}
  #hud .stat.combo .val{color:var(--pink);}
  #hud .stat.acc .val{color:var(--cyan);}

  #stageWrap{
    position:relative;
    width:100%;max-width:620px;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #comboPopup, #judgmentPopup{
    position:absolute;
    left:50%;top:30%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    font-weight:900;
    z-index:20;
    opacity:0;
  }
  #judgmentPopup{top:22%;font-size:1.8rem;letter-spacing:0.08em;}
  #comboPopup{top:34%;font-size:1.1rem;color:var(--gold);}
  #judgmentPopup.anim{animation:judge-pop 0.42s ease;}
  #comboPopup.anim{animation:combo-pop 0.42s ease;}
  @keyframes judge-pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.6);}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
    100%{opacity:0;transform:translate(-50%,-65%) scale(1);}
  }
  @keyframes combo-pop{
    0%{opacity:0;transform:translate(-50%,-40%) scale(0.7);}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
    100%{opacity:0;transform:translate(-50%,-60%) scale(1);}
  }
  .tier-perfect{color:var(--cyan);text-shadow:0 0 18px rgba(59,232,255,0.7);}
  .tier-good{color:var(--green);text-shadow:0 0 14px rgba(73,255,158,0.6);}
  .tier-ok{color:var(--gold);text-shadow:0 0 12px rgba(255,212,71,0.5);}
  .tier-miss{color:#ff5566;text-shadow:0 0 12px rgba(255,85,102,0.5);}

  #highway{
    position:relative;
    width:100%;
    height:min(64vh, 620px);
    display:flex;
    gap:6px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.005) 70%, rgba(255,255,255,0.03));
    border-left:1px solid var(--panel-border);
    border-right:1px solid var(--panel-border);
    border-radius:10px;
    overflow:hidden;
  }
  .lane{
    position:relative;
    flex:1;
    height:100%;
    background:linear-gradient(180deg, color-mix(in srgb, var(--lane-color) 8%, transparent), transparent 40%);
    border-right:1px dashed rgba(255,255,255,0.05);
  }
  .lane:last-child{border-right:none;}
  .notes-layer{position:absolute;inset:0;}
  .judgment-line{
    position:absolute;left:0;right:0;bottom:45px;height:3px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    box-shadow:0 0 12px rgba(255,255,255,0.4);
    z-index:5;
  }
  .key-slot{
    position:absolute;left:50%;bottom:22px;
    width:46px;height:46px;
    transform:translateX(-50%);
    border:2px solid var(--lane-color);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.03);
    transition:transform 0.08s ease, box-shadow 0.08s ease;
  }
  .lane[data-lane="space"] .key-slot{width:78px;height:36px;bottom:27px;border-radius:8px;}
  .key-slot svg{width:70%;height:70%;fill:var(--lane-color);filter:drop-shadow(0 0 5px var(--lane-color));}
  .key-slot.press-hit{
    animation:key-hit 0.18s ease;
  }
  .key-slot.press-empty{
    animation:key-empty 0.18s ease;
  }
  @keyframes key-hit{
    0%{transform:translateX(-50%) scale(1);box-shadow:0 0 0 rgba(255,255,255,0);}
    40%{transform:translateX(-50%) scale(1.22);box-shadow:0 0 24px var(--lane-color);}
    100%{transform:translateX(-50%) scale(1);box-shadow:0 0 0 rgba(255,255,255,0);}
  }
  @keyframes key-empty{
    0%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-50%) scale(0.92);}
    100%{transform:translateX(-50%) scale(1);}
  }

  .note{
    position:absolute;top:0;left:50%;
    width:46px;height:46px;
    will-change:transform;
  }
  .note[data-lane="space"]{width:78px;height:36px;}
  .note svg{width:100%;height:100%;}
  .lane[data-lane="left"] .arrow-shape{transform:rotate(-90deg);transform-origin:50% 50%;}
  .lane[data-lane="down"] .arrow-shape{transform:rotate(180deg);transform-origin:50% 50%;}
  .lane[data-lane="up"] .arrow-shape{transform:rotate(0deg);}
  .lane[data-lane="right"] .arrow-shape{transform:rotate(90deg);transform-origin:50% 50%;}
  .lane[data-lane="left"] .arrow-shape, .lane[data-lane="left"] .bar-shape{fill:var(--pink);filter:drop-shadow(0 0 6px var(--pink));}
  .lane[data-lane="down"] .arrow-shape, .lane[data-lane="down"] .bar-shape{fill:var(--gold);filter:drop-shadow(0 0 6px var(--gold));}
  .lane[data-lane="up"] .arrow-shape, .lane[data-lane="up"] .bar-shape{fill:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan));}
  .lane[data-lane="right"] .arrow-shape, .lane[data-lane="right"] .bar-shape{fill:var(--green);filter:drop-shadow(0 0 6px var(--green));}
  .lane[data-lane="space"] .arrow-shape, .lane[data-lane="space"] .bar-shape{fill:var(--silver);filter:drop-shadow(0 0 6px var(--silver));}

  .note.judged{transition:opacity 0.2s ease, transform 0.2s ease;opacity:0;}
  .note.tier-perfect{filter:brightness(1.6);}
  .note.tier-miss{filter:grayscale(0.7) brightness(0.6);}

  #progressBarWrap{
    width:100%;max-width:620px;
    height:8px;
    background:#0e1730;
    border:1px solid var(--panel-border);
    border-radius:6px;
    margin-top:14px;
    overflow:hidden;
  }
  #progressBar{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--cyan), var(--pink));
    transition:width 0.05s linear;
  }

  #hpBarWrap{
    width:100%;max-width:620px;
    display:flex;align-items:center;gap:10px;
    padding:2px 10px 8px;
  }
  #hpBarLabel{
    font-size:0.68rem;font-weight:800;letter-spacing:0.18em;color:var(--muted);
  }
  #hpBarTrack{
    flex:1;height:11px;
    background:#0e1730;
    border:1px solid var(--panel-border);
    border-radius:6px;
    overflow:hidden;
  }
  #hpBarFill{
    height:100%;width:100%;
    background:linear-gradient(90deg, var(--pink), var(--green));
    transition:width 0.15s ease, background 0.15s ease;
  }

  /* ---------- Result ---------- */
  #resultOverlay .panel{align-items:center;}
  .result-row{display:flex;justify-content:space-between;width:100%;gap:24px;font-size:1.05rem;}
  .result-row .rlabel{color:var(--muted);}
  .result-row .rval{font-weight:800;color:var(--gold);}
  .delta{font-size:0.62em;font-weight:800;margin-left:6px;}
  .delta-up{color:var(--green);}
  .delta-down{color:#ff5566;}
  .delta-flat{color:var(--muted);}

  /* ---------- Fail ---------- */
  .title-fail{
    font-size:2.2rem;font-weight:800;margin:0;letter-spacing:0.1em;
    color:#ff3b5c;
    text-shadow:0 0 30px rgba(255,59,92,0.55);
  }
  #failOverlay .panel{border-color:rgba(255,59,92,0.4);}
  #failOverlay .subtitle{color:#ff90a4;max-width:380px;}
  .secondary-btn{
    margin-top:2px;
    padding:10px 24px;
    font-size:0.85rem;
    font-weight:700;
    letter-spacing:0.05em;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--panel-border);
    border-radius:10px;
    cursor:pointer;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .secondary-btn:hover{color:var(--text);border-color:var(--cyan);}

  @media (max-width:480px){
    .key-slot{width:38px;height:38px;bottom:16px;}
    .lane[data-lane="space"] .key-slot{width:60px;height:30px;bottom:20px;}
    .judgment-line{bottom:37px;}
  }

  #downloadBtn{
    position:fixed;top:14px;right:14px;z-index:200;
    padding:8px 14px;
    font-size:0.78rem;font-weight:700;letter-spacing:0.02em;
    color:var(--text);
    background:rgba(18,26,48,0.85);
    border:1px solid var(--panel-border);
    border-radius:8px;
    cursor:pointer;
    backdrop-filter:blur(4px);
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  #downloadBtn:hover{border-color:var(--cyan);color:var(--cyan);}
  @media (max-width:480px){
    #downloadBtn{top:8px;right:8px;padding:6px 10px;font-size:0.7rem;}
  }

  #backBtn{
    position:fixed;top:14px;left:14px;z-index:200;
    padding:8px 14px;
    font-size:0.78rem;font-weight:700;letter-spacing:0.02em;
    color:var(--text);
    background:rgba(18,26,48,0.85);
    border:1px solid var(--panel-border);
    border-radius:8px;
    cursor:pointer;
    backdrop-filter:blur(4px);
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  #backBtn:hover{border-color:var(--pink);color:var(--pink);}
  @media (max-width:480px){
    #backBtn{top:8px;left:8px;padding:6px 10px;font-size:0.7rem;}
  }
</style>
</head>
<body>
<div id="app">

  <button id="downloadBtn" title="이 게임을 HTML 파일로 다운로드">⬇ HTML 다운로드</button>

  <!-- START OVERLAY -->
  <div id="startOverlay" class="overlay">
    <h1 class="title">NEON PULSE</h1>
    <p class="subtitle">
      ← ↓ ↑ → 방향키와 Space바를 박자에 맞춰 눌러 판정선을 통과하는 노트를 맞추세요.<br>
      스페이스바 노트는 가끔씩만 등장합니다. 배경음악은 전부 코드로 직접 생성됩니다.
    </p>
    <div class="panel">
      <div class="field-row">
        <span>곡 선택</span>
        <select id="songSelect">
          <option value="calm">잔잔한 곡 · Calm (BPM 76)</option>
          <option value="energetic">신나는 곡 · Energetic (BPM 140)</option>
        </select>
      </div>
      <div class="field-row">
        <span>난이도</span>
        <select id="diffSelect">
          <option value="EASY">EASY</option>
          <option value="NORMAL" selected>NORMAL</option>
          <option value="HARD">HARD</option>
        </select>
      </div>
      <div class="field-row">
        <span>스크롤 속도</span>
        <select id="speedSelect" title="판정 타이밍에는 영향 없이 노트가 화면에 떠 있는 속도만 바뀝니다">
          <option value="0.75">0.75x · 느리게</option>
          <option value="1" selected>1.0x · 기본</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x · 촘촘한 채보 추천</option>
          <option value="1.75">1.75x</option>
          <option value="2">2.0x · 빠르게</option>
        </select>
      </div>
      <div class="field-row">
        <span>사운드</span>
        <button id="soundToggleBtn" class="toggle">🔊 사운드 ON</button>
      </div>
      <button id="startBtn" class="big-btn">START</button>
    </div>
  </div>

  <!-- COUNTDOWN OVERLAY -->
  <div id="countdownOverlay" class="overlay hidden">
    <div id="countdownNum">3</div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden">
    <button id="backBtn" title="메뉴로 돌아가기">← 나가기</button>
    <div id="hud">
      <div class="stat score"><span class="label">SCORE</span><span class="val" id="scoreVal">0</span></div>
      <div class="stat combo"><span class="label">MAX COMBO</span><span class="val" id="maxComboVal">0</span></div>
      <div class="stat acc"><span class="label">ACC</span><span class="val" id="accVal">100.00%</span></div>
    </div>
    <div id="hpBarWrap">
      <span id="hpBarLabel">HP</span>
      <div id="hpBarTrack"><div id="hpBarFill"></div></div>
    </div>
    <div id="stageWrap">
      <div id="judgmentPopup"></div>
      <div id="comboPopup"></div>
      <div id="highway">
        <div class="judgment-line"></div>
        <div class="lane" data-lane="left" style="--lane-color:var(--pink)">
          <div class="notes-layer"></div>
          <div class="key-slot"><svg viewBox="0 0 100 100" class="arrow-shape"><polygon points="50,10 88,82 12,82"/></svg></div>
        </div>
        <div class="lane" data-lane="down" style="--lane-color:var(--gold)">
          <div class="notes-layer"></div>
          <div class="key-slot"><svg viewBox="0 0 100 100" class="arrow-shape"><polygon points="50,10 88,82 12,82"/></svg></div>
        </div>
        <div class="lane" data-lane="up" style="--lane-color:var(--cyan)">
          <div class="notes-layer"></div>
          <div class="key-slot"><svg viewBox="0 0 100 100" class="arrow-shape"><polygon points="50,10 88,82 12,82"/></svg></div>
        </div>
        <div class="lane" data-lane="right" style="--lane-color:var(--green)">
          <div class="notes-layer"></div>
          <div class="key-slot"><svg viewBox="0 0 100 100" class="arrow-shape"><polygon points="50,10 88,82 12,82"/></svg></div>
        </div>
        <div class="lane" data-lane="space" style="--lane-color:var(--silver)">
          <div class="notes-layer"></div>
          <div class="key-slot"><svg viewBox="0 0 100 40" class="bar-shape"><rect x="8" y="8" width="84" height="24" rx="10"/></svg></div>
        </div>
      </div>
    </div>
    <div id="progressBarWrap"><div id="progressBar"></div></div>
  </div>

  <!-- RESULT OVERLAY -->
  <div id="resultOverlay" class="overlay hidden">
    <h1 class="title" style="font-size:2rem;">RESULT</h1>
    <div class="panel" style="min-width:280px;">
      <div class="result-row"><span class="rlabel">SCORE</span><span class="rval" id="resScore">0</span></div>
      <div class="result-row"><span class="rlabel">MAX COMBO</span><span class="rval" id="resCombo">0</span></div>
      <div class="result-row"><span class="rlabel">ACCURACY</span><span class="rval" id="resAcc">0.00%</span></div>
      <button id="retryBtn" class="big-btn">RETRY</button>
      <button id="resultHomeBtn" class="secondary-btn">HOME으로 돌아가기</button>
    </div>
  </div>

  <!-- FAIL OVERLAY -->
  <div id="failOverlay" class="overlay hidden">
    <h1 class="title-fail">FAILED</h1>
    <p class="subtitle">HP가 모두 소진되어 실패했습니다.</p>
    <div class="panel" style="min-width:280px;">
      <div class="result-row"><span class="rlabel">SCORE</span><span class="rval" id="failScore">0</span></div>
      <div class="result-row"><span class="rlabel">MAX COMBO</span><span class="rval" id="failCombo">0</span></div>
      <div class="result-row"><span class="rlabel">ACCURACY</span><span class="rval" id="failAcc">0.00%</span></div>
      <button id="retryFailBtn" class="big-btn">RETRY</button>
      <button id="failHomeBtn" class="secondary-btn">HOME으로 돌아가기</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // Snapshot of the pristine page markup, captured before any game state
  // mutates the DOM, so the download button always saves a clean copy.
  const PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  /* =========================================================
     AUDIO ENGINE
     ========================================================= */
  const AudioEngine = (function(){
    let ctx = null;
    let masterGain = null;   // 0.24 overall
    let musicBus = null;     // music -> masterGain
    let sfxBus = null;       // sfx -> masterGain (quieter, shares mute)
    let noiseBuffer = null;

    function init(){
      if (ctx) return;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = 0.24;
      masterGain.connect(ctx.destination);

      musicBus = ctx.createGain();
      musicBus.gain.value = 1.0;
      musicBus.connect(masterGain);

      sfxBus = ctx.createGain();
      sfxBus.gain.value = 0.42; // clearly quieter than music
      sfxBus.connect(masterGain);
    }

    function resume(){
      if (!ctx) return Promise.resolve();
      return ctx.resume();
    }

    function setSoundOn(on){
      if (!masterGain) return;
      masterGain.gain.setTargetAtTime(on ? 0.24 : 0.0001, ctx.currentTime, 0.01);
    }

    function isInited(){ return !!ctx; }

    function getNoiseBuffer(){
      if (noiseBuffer) return noiseBuffer;
      const len = Math.floor(ctx.sampleRate * 0.12);
      noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i=0;i<len;i++) data[i] = Math.random()*2-1;
      return noiseBuffer;
    }

    function playTone(t, freq, dur, type, peak, bus){
      const osc = ctx.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, 0.05));
      osc.connect(g);
      g.connect(bus);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    }

    function playHihat(t, bus){
      const src = ctx.createBufferSource();
      src.buffer = getNoiseBuffer();
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 6500;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
      src.connect(hp); hp.connect(g); g.connect(bus);
      src.start(t);
      src.stop(t + 0.06);
    }

    // Each playthrough gets its own gain node routed through musicBus, so
    // leaving mid-song can silence every already-scheduled note at once
    // (disconnecting stops the signal instantly, regardless of each
    // oscillator's own future stop() time).
    function createRunBus(){
      const bus = ctx.createGain();
      bus.gain.value = 1.0;
      bus.connect(musicBus);
      return bus;
    }

    function scheduleSong(song, startTime, bus){
      song.events.melody.forEach(ev => {
        playTone(startTime + ev.time, ev.freq, ev.dur, song.wave, 0.5, bus);
      });
      song.events.bass.forEach(ev => {
        playTone(startTime + ev.time, ev.freq, ev.dur, 'sine', 0.55, bus);
      });
      if (song.hihat){
        song.events.hihat.forEach(ev => playHihat(startTime + ev.time, bus));
      }
    }

    function playPopSfx(){
      if (!ctx) return;
      const now = ctx.currentTime;
      // fast falling sine sweep 1500 -> 420 Hz over ~0.1s
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1500, now);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.1);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.55, now + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
      osc.connect(g); g.connect(sfxBus);
      osc.start(now); osc.stop(now + 0.11);

      // slightly higher triangle click ~2600Hz, 0.03s
      const click = ctx.createOscillator();
      click.type = 'triangle';
      click.frequency.setValueAtTime(2600, now);
      const cg = ctx.createGain();
      cg.gain.setValueAtTime(0.0001, now);
      cg.gain.exponentialRampToValueAtTime(0.35, now + 0.004);
      cg.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
      click.connect(cg); cg.connect(sfxBus);
      click.start(now); click.stop(now + 0.035);
    }

    return { init, resume, setSoundOn, isInited, scheduleSong, playPopSfx, createRunBus,
      get ctx(){ return ctx; } };
  })();

  /* =========================================================
     SONG DEFINITIONS (procedural, motif-based)
     ========================================================= */
  const SCALE_CALM       = [220.00, 261.63, 293.66, 329.63, 392.00]; // A minor pentatonic, low register
  const SCALE_ENERGETIC  = [523.25, 587.33, 659.25, 783.99, 880.00]; // C major pentatonic, bright register

  const MOTIFS_CALM = {
    A: [0, 2, 4, 2, 0, null, 2, null],
    B: [4, 3, 2, 1, 0, 1, 2, 3],
    C: [2, null, 4, null, 3, null, 1, null],
    D: [0, 0, null, 2, 2, null, 4, 4]
  };
  const MOTIFS_ENERGETIC = {
    A: [0, 1, 2, 1, 0, 1, 2, 3],
    B: [4, 3, 2, 1, 2, 3, 4, 3],
    C: [2, 2, 3, 3, 4, 4, 3, 2],
    D: [0, 2, 0, 2, 4, 2, 4, 3]
  };

  const SONGS = {
    calm: {
      key:'calm', name:'잔잔한 곡 (Calm)', bpm:76, wave:'sine', hihat:false,
      scale: SCALE_CALM, motifs: MOTIFS_CALM,
      structure: ['A','A','B','A','C','C','D','B','A','A','B','C','A','D','B','A'],
      bars: 24
    },
    energetic: {
      key:'energetic', name:'신나는 곡 (Energetic)', bpm:140, wave:'square', hihat:true,
      scale: SCALE_ENERGETIC, motifs: MOTIFS_ENERGETIC,
      structure: ['A','A','B','A','C','C','D','B','A','B','C','D','A','A','B','D'],
      bars: 40
    }
  };

  const SONG_TRIM_SECONDS = 15; // shave this much off the end of every generated song

  function buildSong(def){
    const beatSec = 60 / def.bpm;
    const stepSec = beatSec / 2; // eighth-note grid
    const stepsPerBar = 8;
    const rawTotalSteps = def.bars * stepsPerBar;
    const events = { melody:[], bass:[], hihat:[] };

    for (let step = 0; step < rawTotalSteps; step++){
      const bar = Math.floor(step / stepsPerBar);
      const s = step % stepsPerBar;
      const motifName = def.structure[bar % def.structure.length];
      const deg = def.motifs[motifName][s];
      const t = step * stepSec;

      if (deg !== null){
        events.melody.push({ time:t, freq: def.scale[deg], dur: stepSec * 0.85 });
      }
      if (s % 2 === 0){ // strong-beat bass, one per quarter beat
        events.bass.push({ time:t, freq: def.scale[0] / 2, dur: stepSec * 1.7 });
      }
      if (def.hihat){
        events.hihat.push({ time:t });
      }
    }

    const rawDuration = rawTotalSteps * stepSec;
    const duration = Math.max(stepSec, rawDuration - SONG_TRIM_SECONDS);
    const totalSteps = Math.floor(duration / stepSec);

    events.melody = events.melody.filter(ev => ev.time < duration);
    events.bass = events.bass.filter(ev => ev.time < duration);
    events.hihat = events.hihat.filter(ev => ev.time < duration);

    return { ...def, beatSec, stepSec, totalSteps, duration, events };
  }

  function degreeAtStep(song, step){
    const bar = Math.floor(step / 8);
    const s = step % 8;
    const motifName = song.structure[bar % song.structure.length];
    const deg = song.motifs[motifName][s];
    return deg === null ? 0 : deg;
  }

  function buildChart(song, difficulty){
    const notes = [];
    const laneCycle = ['left','down','up','right'];
    let n = 0;
    for (let step = 0; step < song.totalSteps; step++){
      let include;
      if (difficulty === 'EASY') include = (step % 4 === 0);
      else if (difficulty === 'NORMAL') include = (step % 2 === 0);
      else include = true; // HARD: every eighth-note step

      if (!include) continue;

      const isSpace = (n % 6 === 5); // roughly 1 in 6 notes
      let lane;
      if (isSpace){
        lane = 'space';
      } else {
        const deg = degreeAtStep(song, step);
        lane = laneCycle[(n + deg) % 4];
      }
      notes.push({ time: step * song.stepSec, lane, judged:false, spawned:false, el:null });
      n++;
    }
    return notes;
  }

  /* =========================================================
     GAME CONSTANTS
     ========================================================= */
  const BASE_FALL_TIME = 1.8;      // seconds, note travel time at 1.0x scroll speed
                                    // (judgment stays purely time-based, so changing this only
                                    // changes how long notes are visible/how spread out they look —
                                    // never how the hit is scored)
  const PERFECT_WINDOW = 0.045;
  const GOOD_WINDOW = 0.09;
  const OK_WINDOW = 0.15;
  const MISS_WINDOW = 0.15;
  const JUDGE_OFFSET_BOTTOM = 45;  // px from bottom of highway to judgment line
  const ARROW_SIZE = 46, BAR_SIZE = 36;
  // HP/life gauge: bounded, so a late-game collapse always costs a fixed
  // amount of HP regardless of how good earlier judgments were (unlike a
  // lifetime accuracy average, which barely moves once many notes are judged).
  const HP_MAX = 100;
  const HP_PERFECT_GAIN = 1;
  const HP_MISS_LOSS = 8;

  const ARROW_SVG = '<svg viewBox="0 0 100 100" class="arrow-shape"><polygon points="50,10 88,82 12,82"/></svg>';
  const BAR_SVG   = '<svg viewBox="0 0 100 40" class="bar-shape"><rect x="8" y="8" width="84" height="24" rx="10"/></svg>';

  const KEY_LANE_MAP = { ArrowLeft:'left', ArrowDown:'down', ArrowUp:'up', ArrowRight:'right', Space:'space' };

  /* =========================================================
     DOM REFS
     ========================================================= */
  const startOverlay = document.getElementById('startOverlay');
  const countdownOverlay = document.getElementById('countdownOverlay');
  const countdownNum = document.getElementById('countdownNum');
  const gameScreen = document.getElementById('gameScreen');
  const resultOverlay = document.getElementById('resultOverlay');
  const failOverlay = document.getElementById('failOverlay');

  const songSelect = document.getElementById('songSelect');
  const diffSelect = document.getElementById('diffSelect');
  const speedSelect = document.getElementById('speedSelect');
  const soundToggleBtn = document.getElementById('soundToggleBtn');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');

  const scoreVal = document.getElementById('scoreVal');
  const maxComboVal = document.getElementById('maxComboVal');
  const accVal = document.getElementById('accVal');
  const judgmentPopupEl = document.getElementById('judgmentPopup');
  const comboPopupEl = document.getElementById('comboPopup');
  const highwayEl = document.getElementById('highway');
  const progressBarEl = document.getElementById('progressBar');
  const hpBarFillEl = document.getElementById('hpBarFill');

  const resScore = document.getElementById('resScore');
  const resCombo = document.getElementById('resCombo');
  const resAcc = document.getElementById('resAcc');
  const failScoreEl = document.getElementById('failScore');
  const failComboEl = document.getElementById('failCombo');
  const failAccEl = document.getElementById('failAcc');
  const retryFailBtn = document.getElementById('retryFailBtn');
  const failHomeBtn = document.getElementById('failHomeBtn');
  const resultHomeBtn = document.getElementById('resultHomeBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const backBtn = document.getElementById('backBtn');

  const laneLayers = {};
  const keySlots = {};
  document.querySelectorAll('.lane').forEach(laneEl => {
    const lane = laneEl.dataset.lane;
    laneLayers[lane] = laneEl.querySelector('.notes-layer');
    keySlots[lane] = laneEl.querySelector('.key-slot');
  });

  /* =========================================================
     STATE
     ========================================================= */
  let soundEnabled = true;
  let selectedSongKey = 'calm';
  let selectedDifficulty = 'NORMAL';
  let selectedSpeedMultiplier = 1;
  let fallTime = BASE_FALL_TIME; // recomputed from selectedSpeedMultiplier each run

  let currentSong = null;
  let currentChart = [];
  let songStartCtxTime = 0;
  let songEndCtxTime = 0;
  let rafId = null;
  let running = false;
  let currentRunBus = null;
  let hp = HP_MAX;

  let score = 0, combo = 0, maxCombo = 0;
  let judgeCounts = { PERFECT:0, GOOD:0, OK:0, MISS:0 };

  /* =========================================================
     HELPERS
     ========================================================= */
  function formatScore(n){
    return n.toLocaleString('en-US');
  }

  /* ---------- Round-over-round comparison (persisted in localStorage) ---------- */
  const LAST_RUN_KEY = 'neonPulseLastRun';

  function loadLastRun(){
    try{
      const raw = localStorage.getItem(LAST_RUN_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function saveLastRun(stats){
    try{ localStorage.setItem(LAST_RUN_KEY, JSON.stringify(stats)); }catch(e){}
  }

  function deltaBadge(diff, formatter){
    if (diff === null || diff === undefined) return '';
    if (diff === 0) return ' <span class="delta delta-flat">(변화 없음)</span>';
    const cls = diff > 0 ? 'delta-up' : 'delta-down';
    const sign = diff > 0 ? '+' : '';
    return ` <span class="delta ${cls}">(${sign}${formatter(diff)})</span>`;
  }

  // Renders SCORE/MAX COMBO/ACC against the previous round's saved result,
  // then overwrites that saved result with the current round.
  function applyRoundComparison(scoreEl, comboEl, accEl, current){
    const last = loadLastRun();
    const scoreDelta = last ? current.score - last.score : null;
    const comboDelta = last ? current.maxCombo - last.maxCombo : null;
    const accDelta = last ? current.acc - last.acc : null;

    scoreEl.innerHTML = formatScore(current.score) + deltaBadge(scoreDelta, formatScore);
    comboEl.innerHTML = current.maxCombo + deltaBadge(comboDelta, d => String(d));
    accEl.innerHTML = current.acc.toFixed(2) + '%' + deltaBadge(accDelta, d => d.toFixed(2) + '%p');

    saveLastRun(current);
  }

  function restartAnim(el, cls){
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function resetStats(){
    score = 0; combo = 0; maxCombo = 0;
    judgeCounts = { PERFECT:0, GOOD:0, OK:0, MISS:0 };
    hp = HP_MAX;
    updateHUD();
  }

  function currentAccuracy(){
    const weights = { PERFECT:1, GOOD:0.7, OK:0.4, MISS:0 };
    let judged = 0, sum = 0;
    for (const k in judgeCounts){ sum += judgeCounts[k]*weights[k]; judged += judgeCounts[k]; }
    if (judged === 0) return 100;
    return (sum/judged)*100;
  }

  function updateHUD(){
    scoreVal.textContent = formatScore(score);
    maxComboVal.textContent = maxCombo;
    accVal.textContent = currentAccuracy().toFixed(2) + '%';
    updateHpBar();
  }

  function updateHpBar(){
    const pct = Math.max(0, Math.min(100, (hp / HP_MAX) * 100));
    hpBarFillEl.style.width = pct + '%';
    if (pct < 25) hpBarFillEl.style.background = '#ff3b5c';
    else if (pct < 55) hpBarFillEl.style.background = 'linear-gradient(90deg, #ff3b5c, var(--gold))';
    else hpBarFillEl.style.background = 'linear-gradient(90deg, var(--pink), var(--green))';
  }

  /* =========================================================
     GAME FLOW
     ========================================================= */
  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([PRISTINE_HTML], { type:'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'neon-pulse-rhythm-game.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  soundToggleBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggleBtn.textContent = soundEnabled ? '🔊 사운드 ON' : '🔈 사운드 OFF';
    soundToggleBtn.classList.toggle('off', !soundEnabled);
    if (AudioEngine.isInited()) AudioEngine.setSoundOn(soundEnabled);
  });

  startBtn.addEventListener('click', async () => {
    selectedSongKey = songSelect.value;
    selectedDifficulty = diffSelect.value;
    selectedSpeedMultiplier = parseFloat(speedSelect.value) || 1;
    AudioEngine.init();
    await AudioEngine.resume();
    AudioEngine.setSoundOn(soundEnabled);
    startOverlay.classList.add('hidden');
    countdownOverlay.classList.remove('hidden');
    runCountdown();
  });

  async function retryPlay(){
    await AudioEngine.resume();
    resultOverlay.classList.add('hidden');
    failOverlay.classList.add('hidden');
    countdownOverlay.classList.remove('hidden');
    runCountdown();
  }
  retryBtn.addEventListener('click', retryPlay);
  retryFailBtn.addEventListener('click', retryPlay);

  function runCountdown(){
    let n = 3;
    countdownNum.textContent = n;
    restartAnim(countdownNum, 'pop');
    const tick = () => {
      n--;
      if (n <= 0){
        countdownNum.textContent = 'GO!';
        restartAnim(countdownNum, 'pop');
        setTimeout(beginLeadIn, 450);
        return;
      }
      countdownNum.textContent = n;
      restartAnim(countdownNum, 'pop');
      setTimeout(tick, 700);
    };
    setTimeout(tick, 700);
  }

  function beginLeadIn(){
    countdownOverlay.classList.add('hidden');
    gameScreen.classList.remove('hidden');

    const songDef = SONGS[selectedSongKey];
    currentSong = buildSong(songDef);
    currentChart = buildChart(currentSong, selectedDifficulty);

    resetStats();
    progressBarEl.style.width = '0%';
    fallTime = BASE_FALL_TIME / selectedSpeedMultiplier;

    const ctxNow = AudioEngine.ctx.currentTime;
    songStartCtxTime = ctxNow + fallTime; // first note (t=0) arrives exactly when lead-in ends
    songEndCtxTime = songStartCtxTime + currentSong.duration + fallTime + 0.4;

    currentRunBus = AudioEngine.createRunBus();
    AudioEngine.scheduleSong(currentSong, songStartCtxTime, currentRunBus);

    running = true;
    rafId = requestAnimationFrame(loop);
  }

  function stopRunAudio(){
    if (currentRunBus){
      try { currentRunBus.disconnect(); } catch(e){}
      currentRunBus = null;
    }
  }

  function exitToMenu(){
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopRunAudio();
    document.querySelectorAll('.notes-layer').forEach(l => { l.innerHTML = ''; });
    gameScreen.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    failOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  }

  backBtn.addEventListener('click', exitToMenu);
  failHomeBtn.addEventListener('click', exitToMenu);
  resultHomeBtn.addEventListener('click', exitToMenu);

  function loop(){
    if (!running) return;
    const now = AudioEngine.ctx.currentTime;
    updateNotes(now);
    updateProgressBar(now);
    if (!running) return; // a MISS just processed inside updateNotes may have already ended the run
    if (now >= songEndCtxTime){
      endGame();
      return;
    }
    rafId = requestAnimationFrame(loop);
  }

  function triggerFail(){
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopRunAudio();
    document.querySelectorAll('.notes-layer').forEach(l => { l.innerHTML = ''; });

    applyRoundComparison(failScoreEl, failComboEl, failAccEl, { score, maxCombo, acc: currentAccuracy() });

    gameScreen.classList.add('hidden');
    failOverlay.classList.remove('hidden');
  }

  function updateNotes(now){
    const rect = highwayEl.getBoundingClientRect();
    const containerH = rect.height;

    for (let i = 0; i < currentChart.length; i++){
      const note = currentChart[i];
      if (note.judged) continue;

      const arrival = songStartCtxTime + note.time;
      const spawnTime = arrival - fallTime;

      if (now < spawnTime) break; // chart sorted ascending; nothing further has spawned yet

      if (!note.spawned){
        spawnNoteVisual(note);
        note.spawned = true;
      }

      if (now > arrival + MISS_WINDOW){
        if (applyJudgment('MISS', note)) return; // HP hit 0; run over, notes already cleared
        continue;
      }

      const noteH = note.lane === 'space' ? BAR_SIZE : ARROW_SIZE;
      const arrivalY = containerH - JUDGE_OFFSET_BOTTOM - noteH/2;
      const spawnY = -noteH;
      const progress = Math.min(1.2, (now - spawnTime) / fallTime);
      const y = spawnY + progress * (arrivalY - spawnY);
      note.el.style.transform = `translate(-50%, ${y}px)`;
    }
  }

  function updateProgressBar(now){
    const frac = Math.max(0, Math.min(1, (now - songStartCtxTime) / currentSong.duration));
    progressBarEl.style.width = (frac*100) + '%';
  }

  function spawnNoteVisual(note){
    const el = document.createElement('div');
    el.className = 'note';
    el.dataset.lane = note.lane;
    el.innerHTML = note.lane === 'space' ? BAR_SVG : ARROW_SVG;
    laneLayers[note.lane].appendChild(el);
    note.el = el;
  }

  function removeNoteVisual(note, tier){
    const el = note.el;
    if (!el) return;
    el.classList.add('judged', 'tier-' + tier.toLowerCase());
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
  }

  function flashKey(lane, hit){
    const slot = keySlots[lane];
    restartAnim(slot, hit ? 'press-hit' : 'press-empty');
  }

  function showJudgmentPopup(tier){
    judgmentPopupEl.textContent = tier;
    judgmentPopupEl.className = 'tier-' + tier.toLowerCase();
    restartAnim(judgmentPopupEl, 'anim');
  }

  function showComboPopup(){
    if (combo < 2) return;
    comboPopupEl.textContent = combo + ' COMBO';
    restartAnim(comboPopupEl, 'anim');
  }

  // Returns true if this judgment just drained HP to 0 and ended the run.
  function applyJudgment(tier, note){
    note.judged = true;
    judgeCounts[tier]++;

    if (tier === 'MISS'){
      combo = 0;
      hp = Math.max(0, hp - HP_MISS_LOSS);
    } else {
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      const base = { PERFECT:1000, GOOD:700, OK:300 }[tier];
      const comboBonus = Math.min(combo, 50) * 10;
      score += base + comboBonus;
      if (tier === 'PERFECT'){
        AudioEngine.playPopSfx();
        hp = Math.min(HP_MAX, hp + HP_PERFECT_GAIN);
      }
      // GOOD/OK: HP unchanged
      showComboPopup();
    }

    removeNoteVisual(note, tier);
    showJudgmentPopup(tier);
    updateHUD();

    if (hp <= 0){
      triggerFail();
      return true;
    }
    return false;
  }

  function judgeLane(lane, now){
    let best = null, bestDiff = Infinity;
    for (let i = 0; i < currentChart.length; i++){
      const note = currentChart[i];
      if (note.lane !== lane || note.judged) continue;
      const arrival = songStartCtxTime + note.time;
      const diff = now - arrival;
      if (Math.abs(diff) <= OK_WINDOW && Math.abs(diff) < Math.abs(bestDiff)){
        best = note; bestDiff = diff;
      }
    }
    if (!best){
      flashKey(lane, false);
      return;
    }
    const ad = Math.abs(bestDiff);
    let tier;
    if (ad <= PERFECT_WINDOW) tier = 'PERFECT';
    else if (ad <= GOOD_WINDOW) tier = 'GOOD';
    else tier = 'OK';
    applyJudgment(tier, best);
    flashKey(lane, true);
  }

  function endGame(){
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    currentRunBus = null; // song finished naturally; nothing left scheduled to silence
    document.querySelectorAll('.notes-layer').forEach(l => { l.innerHTML=''; });
    progressBarEl.style.width = '100%';

    applyRoundComparison(resScore, resCombo, resAcc, { score, maxCombo, acc: currentAccuracy() });

    gameScreen.classList.add('hidden');
    resultOverlay.classList.remove('hidden');
  }

  /* =========================================================
     INPUT
     ========================================================= */
  window.addEventListener('keydown', (e) => {
    const lane = KEY_LANE_MAP[e.code];
    if (!lane) return;
    if (!running) return; // let menus/buttons/selects handle their own key input
    e.preventDefault();
    if (e.repeat) return;
    const now = AudioEngine.ctx.currentTime;
    judgeLane(lane, now);
  });

})();
</script>
</body>
</html>
